# Seed-based Synthetic Anomaly Generation Configuration
# Mesh-aware sculpting: Seeds → Sculpting with natural falloff → Distance GT

# Global settings
seed: 42                          # Random seed for reproducibility
output_dir: synthetic_data        # Output directory for synthetic anomalies
num_synthetic_per_sample: 100     # Total synthetic samples per training sample (sum of all counts)
visualize: false                  # Visualize each generated anomaly (set true for debugging)

# Training deformations (used for synthetic anomaly generation)
train_deformations:
  # === Very short lines (5-10 points) - localized defects ===
  - name: line_tiny_sharp
    config: line_tiny_sharp_config
    count: 10

  - name: line_tiny_smooth
    config: line_tiny_smooth_config
    count: 10

  # === Short lines (10-15 points) - small anomalies ===
  - name: line_short_strong
    config: line_short_strong_config
    count: 10

  - name: line_short_wide
    config: line_short_wide_config
    count: 10

  # === Medium lines (15-20 points) - balanced ===
  - name: line_medium_gaussian
    config: line_medium_gaussian_config
    count: 10

  - name: line_medium_linear
    config: line_medium_linear_config
    count: 10

  # === Longer lines (20-25 points) - elongated defects ===
  - name: line_long_subtle
    config: line_long_subtle_config
    count: 10

  - name: line_long_cosine
    config: line_long_cosine_config
    count: 10

  # === Point seeds (10% - pour varier) ===
  - name: point_small
    config: point_small_config
    count: 5

  - name: point_large
    config: point_large_config
    count: 5

# Validation deformations
val_deformations:
  - name: line_tiny_val
    config: line_tiny_smooth_config
    count: 2

  - name: line_medium_val
    config: line_medium_gaussian_config
    count: 2

  - name: line_long_val
    config: line_long_subtle_config
    count: 2

  - name: point_val
    config: point_small_config
    count: 2


# =============================================================================
# Configuration Definitions - LINE DEFORMATIONS (privileged)
# =============================================================================

# --- Smooth line with Gaussian falloff ---
line_smooth_config:
  seed:
    type: line_fps
    num_seeds: 10                      # 3 line seeds
    line_length: 60                   # Number of points per line
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.18            # Medium radius
    amplitude: 0.09                   # Medium amplitude
    falloff_type: gaussian
    smoothing_iterations: 4           # Smooth sculpting
    k_neighbors: 20
    distance_threshold: 0.01          # STRICT GT (increased from 0.05)
    direction: null                   # Random bulge/dent


# --- Sharp line with Gaussian falloff ---
line_sharp_config:
  seed:
    type: line_fps
    num_seeds: 10                      # Fewer, longer lines
    line_length: 80                   # Number of points per line (longer)
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.15
    amplitude: 0.12                   # Stronger amplitude
    falloff_type: gaussian
    smoothing_iterations: 2           # Less smoothing = sharper
    k_neighbors: 20
    distance_threshold: 0.01          # STRICT GT
    direction: null


# --- Linear falloff line (sharper edges) ---
line_linear_config:
  seed:
    type: line_fps
    num_seeds: 10
    line_length: 50                   # Number of points per line
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.16
    amplitude: 0.08
    falloff_type: linear              # Linear falloff (sharper than Gaussian)
    smoothing_iterations: 3
    k_neighbors: 20
    distance_threshold: 0.01          # STRICT GT
    direction: null


# --- Linear falloff sharp ---
line_linear_sharp_config:
  seed:
    type: line_fps
    num_seeds: 10
    line_length: 70                   # Number of points per line
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.14
    amplitude: 0.11
    falloff_type: linear
    smoothing_iterations: 2           # Sharp edges
    k_neighbors: 20
    distance_threshold: 0.01          # STRICT GT
    direction: null


# --- Cosine falloff line (very smooth transitions) ---
line_cosine_config:
  seed:
    type: line_fps
    num_seeds: 10
    line_length: 0.06
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.20            # Wider influence
    amplitude: 0.08
    falloff_type: cosine              # Very smooth falloff
    smoothing_iterations: 5           # Very smooth sculpting
    k_neighbors: 25
    distance_threshold: 0.01          # STRICT GT
    direction: null


# --- Multiple line seeds (distributed defects) ---
multiline_config:
  seed:
    type: line_fps
    num_seeds: 10                      # Many lines = distributed defects
    line_length: 40                   # Number of points per line (shorter)
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.12            # Smaller radius per line
    amplitude: 0.07
    falloff_type: gaussian
    smoothing_iterations: 3
    k_neighbors: 20
    distance_threshold: 0.01          # STRICT GT
    direction: null


# --- Strong deformation line ---
line_strong_config:
  seed:
    type: line_fps
    num_seeds: 10
    line_length: 70                   # Number of points per line
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.22            # Large radius
    amplitude: 0.15                   # Strong deformation
    falloff_type: gaussian
    smoothing_iterations: 6           # More smoothing for strong deformations
    k_neighbors: 25
    distance_threshold: 0.01         # VERY STRICT GT (strong deformations)
    direction: null


# --- Narrow/localized line defect ---
line_narrow_config:
  seed:
    type: line_fps
    num_seeds: 10
    line_length: 25
    k_neighbors: 5
    use_fps: false                    # false=random (different each time), true=FPS (deterministic)

  deformation:
    influence_radius: 0.10            # Small radius (localized)
    amplitude: 0.10                   # Strong but localized
    falloff_type: linear              # Sharp falloff
    smoothing_iterations: 2           # Less smoothing = sharper
    k_neighbors: 15
    distance_threshold: 0.01          # STRICT GT
    direction: null


