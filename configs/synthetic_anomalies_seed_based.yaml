# =============================================================================
# Parameter Guide
# =============================================================================

# Seed Parameters:
#   - type: 'line_fps' (preferred!), 'point_fps', 'point_random'
#   - num_seeds: Number of seeds (more = distributed anomalies)
#   - line_length: Number of points per line seed (40-120 points, absolute count)
#   - k_neighbors: Neighbors for line growth (typically 5)
#   - use_fps:
#       * false (recommended): Random sampling - DIFFERENT patches each time
#       * true: FPS sampling - deterministic, same patches for same point cloud

# Deformation Parameters:
#   - influence_radius: Deformation extent (0.10-0.25)
#   - amplitude: Deformation strength (0.06-0.15)
#   - falloff_type:
#       * 'gaussian': Natural smooth falloff (recommended)
#       * 'linear': Sharper edges
#       * 'cosine': Very smooth transitions
#   - smoothing_iterations: Mesh smoothing (2-8)
#       * 2-3: Sharper defects
#       * 4-5: Normal sculpting
#       * 6-8: Very smooth, natural
#   - k_neighbors: Mesh connectivity (15-30)
#   - distance_threshold: GT strictness (0.07-0.10, INCREASED for stricter GT!)
#   - direction: 1 (bulge), -1 (dent), null (random 50/50)

# Tuning Tips:
#   - Line seeds create elongated defects (scratches, cracks)
#   - Point seeds create circular defects (dents, bulges)
#   - use_fps=false (RECOMMENDED): Random patches, different each generation
#   - use_fps=true: Deterministic FPS, same patches (useful for debugging)
#   - Increase influence_radius for broader deformations
#   - Increase amplitude for stronger deformations
#   - Increase smoothing_iterations for smoother, more natural results
#   - Increase distance_threshold for stricter GT (fewer "anomalous" points)
#   - Use gaussian falloff for most natural results
#   - Use linear falloff for sharper, more visible defects
#   - Vary num_seeds and line_length for different defect patterns
#
# IMPORTANT: When you comment out a deformation config, the next one will use
# DIFFERENT patches (because use_fps=false uses random sampling)
