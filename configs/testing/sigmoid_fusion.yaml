# Training Configuration for SigmoidFusion Model

# Data paths
data:
  dataset_path: real3d-ad  # Base dataset path
  synthetic_dir: synthetic_data  # Synthetic anomalies directory
  synthetic_config: configs/synthetic_anomalies_seed_based.yaml  # Synthetic config path

# Model architecture
model:
  name: SigmoidFusion
  patch_feature_dim: 7  # Memory bank statistics dimension
  hidden_dim: 16        # Hidden layer size

# Training hyperparameters
training:
  epochs: 5
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001

  # Loss function
  loss_type: patch_contrastive  # Options: focal, bce, patch_contrastive, ranking_reg

  # Patch contrastive loss (if loss_type=patch_contrastive)
  loss_margin: 0.5
  loss_num_pairs: 100

  # Optimizer
  optimizer: adam  # Options: adam, adamw, sgd

  # Learning rate scheduler
  scheduler:
    type: reduce_on_plateau  # Options: reduce_on_plateau, cosine, step
    patience: 15
    factor: 0.5
    min_lr: 0.000001

  # Early stopping
  early_stopping_patience: 500  # 0 to disable

# Patch extraction
patches:
  num_patches: 300      # Number of patches for training
  num_patches_test: 2048  # Number of patches for testing
  patch_size: 128       # Points per patch
  k_centers: 30        # Number of nearest centers for scoring
  max_points: 150000    # Maximum points per point cloud

# Evaluation
evaluation:
  batch_size: 1  # Number of test samples to process in parallel (higher = faster but more VRAM)
  eval_every_n_epochs: 5  # Evaluate every N epochs (1 = every epoch, 5 = every 5 epochs, etc.)

# Logging
logging:
  log_dir: logs
  save_every_epoch: true
  visualize:   # Visualize during evaluation

# Reproducibility
seed: 2020